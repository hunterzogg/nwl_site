<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Schedule Swap 2026 — National Wayzata League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=19">
<style>
/* Schedule swap: every manager's record if he'd had each other manager's schedule. Computed in the browser from
   data/season_2026/matchups.json. ?through=N fixes the cutoff week (commentary snapshots use it); otherwise it uses
   the last fully played week. ?embed=1 hides the nav, header and footer for the Commentary sub-tab. */
.ss-back{display:inline-block;margin-bottom:10px;font-family:var(--font-mono);font-size:.78rem;color:var(--live-bright);text-decoration:none}
.ss-back:hover{text-decoration:underline}
html.embed,html.embed body{background:transparent}
html.embed .ss-back,html.embed .hx-hero,html.embed footer,html.embed .site-nav,html.embed nav.nav{display:none!important}
html.embed .container{padding:0!important;max-width:none}
.ss-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-bottom:32px}
.ss-wrap section{min-width:0}
.ss-intro{color:var(--text-muted);font-size:.9rem;line-height:1.5;max-width:72ch;margin:0}
.ss-h{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;font-size:1.05rem;margin:0 0 8px}
.ss-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ss-grid{border-collapse:separate;border-spacing:0;font-family:var(--font-mono);font-size:.78rem;font-variant-numeric:tabular-nums;width:100%}
.ss-grid th,.ss-grid td{padding:7px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.ss-grid thead th{font-weight:600;color:var(--text-muted);font-size:.68rem;letter-spacing:.04em;vertical-align:bottom;background:var(--surface)}
.ss-grid thead th .dot{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 4px}
.ss-grid .rowh{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font-family:var(--font-body);font-size:.82rem;font-weight:600;border-right:1px solid var(--line)}
.ss-grid .corner{position:sticky;left:0;z-index:2;text-align:left;font-family:var(--font-mono);font-size:.62rem;line-height:1.3;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;border-right:1px solid var(--line)}
.ss-grid td.c{color:var(--text)}
.ss-grid td.self{outline:2px solid var(--live);outline-offset:-3px;font-weight:600;color:var(--live-bright)}
.ss-grid td.sum{border-left:1px solid var(--line);color:var(--text);font-weight:600}
.ss-grid tr.foot td,.ss-grid tr.foot th{border-bottom:none;border-top:1px solid var(--line-strong);color:var(--text-muted)}
.ss-grid .pos{color:#4FA876}.ss-grid .neg{color:#E0524A}
.ss-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.74rem;color:var(--text-muted);margin-top:8px}
.ss-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.ss-bars{display:flex;flex-direction:column;gap:6px;max-width:640px}
.ss-bar{display:grid;grid-template-columns:110px 1fr 1fr 56px;align-items:center;gap:8px;font-size:.82rem}
.ss-bar .neg-side{display:flex;justify-content:flex-end}.ss-bar .pos-side{display:flex}
.ss-bar .fill{height:14px;border-radius:3px}
.ss-bar .v{font-family:var(--font-mono);font-size:.78rem;text-align:right}
.ss-note{font-size:.76rem;color:var(--text-muted);max-width:72ch;margin:8px 0 0;line-height:1.45}
@media (max-width:640px){.ss-grid th,.ss-grid td{padding:6px 4px}.ss-bar{grid-template-columns:86px 1fr 1fr 48px}}
</style>
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
</head>
<body>

<div class="container" style="padding-top: 24px;">
  <a class="ss-back" href="season-2026.html#commentary">&larr; Back to commentary</a>
  <header class="hx-hero live">
    <div class="hx-eyebrow"><span class="nav-live-dot"></span> 2026 Season</div>
    <h1>Schedule Swap</h1>
    <p>Every manager's record if he'd played each other manager's schedule.</p>
  </header>
  <div class="ss-wrap" id="ssRoot"><p class="ss-intro">Loading…</p></div>
</div>

<footer>National Wayzata League &middot; est. 2013</footer>

<script src="../assets/js/shared.js?v=25"></script>
<script>
(async () => {
  const embedded = document.documentElement.classList.contains('embed');
  if (!embedded) renderNav('2026 hub');
  const [managers, weeks] = await Promise.all([getManagers(), loadData('season_2026/matchups')]);
  const done = weeks.filter(w => w.games.length && w.games.every(g => g.winner !== 'UNDECIDED')).map(w => w.week);
  const through = Number(new URLSearchParams(location.search).get('through')) || Math.max(...done);
  const played = weeks.filter(w => w.week <= through && done.includes(w.week));
  const score = {}, opp = {};
  played.forEach(w => w.games.forEach(g => {
    score[w.week + '|' + g.home_manager] = g.home_score; score[w.week + '|' + g.away_manager] = g.away_score;
    opp[w.week + '|' + g.home_manager] = g.away_manager; opp[w.week + '|' + g.away_manager] = g.home_manager;
  }));
  const teams = [...new Set(Object.keys(score).map(k => k.split('|')[1]))];
  // a's record with b's schedule: each week a's score vs. b's opponent's score; the week b played a is skipped
  const rec = (a, b) => {
    const r = { w: 0, l: 0, t: 0 };
    played.forEach(({ week }) => {
      const o = opp[week + '|' + b];
      if (!o || o === a) return;
      const d = score[week + '|' + a] - score[week + '|' + o];
      d > 0 ? r.w++ : d < 0 ? r.l++ : r.t++;
    });
    r.n = r.w + r.l + r.t; r.pct = r.n ? (r.w + r.t / 2) / r.n : 0;
    return r;
  };
  const M = {}; teams.forEach(a => { M[a] = {}; teams.forEach(b => { M[a][b] = rec(a, b); }); });
  const actual = a => M[a][a];
  const others = a => teams.filter(b => b !== a).map(b => M[a][b]);
  const avgPct = a => others(a).reduce((s, r) => s + r.pct, 0) / (teams.length - 1);
  const order = [...teams].sort((a, b) => actual(b).pct - actual(a).pct || avgPct(b) - avgPct(a));
  const schedPct = b => teams.filter(a => a !== b).reduce((s, a) => s + M[a][b].pct, 0) / (teams.length - 1);
  const fmt = r => `${r.w}-${r.l}${r.t ? '-' + r.t : ''}`;
  const short = n => n.length > 6 ? n.slice(0, 5) + '.' : n;
  const color = n => managerColor(managers, n);
  // Cell shade: his win rate on that schedule vs. his real win rate. Any difference is shaded, darker the bigger it
  // is, since a swapped record can cover 9 games (6-3, .667) vs. his real 10 (7-3, .700). Same rate, no shade.
  const shade = (a, r) => {
    const diff = r.pct - actual(a).pct;
    if (Math.abs(diff) < 0.001) return '';
    const alpha = Math.min(0.6, 0.1 + Math.abs(diff) * 1.1).toFixed(2);
    return `background:${diff > 0 ? `rgba(79,168,118,${alpha})` : `rgba(224,82,74,${alpha})`}`;
  };
  const luck = a => actual(a).w - avgPct(a) * actual(a).n;

  const head = `<tr><th class="corner">Team ↓<br>Schedule →</th>${order.map(b =>
    `<th title="${b}'s schedule"><span class="dot" style="background:${color(b)}"></span>${short(b)}</th>`).join('')}<th title="Average win rate on the other 11 schedules">Avg W%</th><th title="Real wins minus wins expected from the average">Luck</th></tr>`;
  const body = order.map(a => `<tr><th class="rowh">${managerTag(managers, a)}</th>${order.map(b => {
    const r = M[a][b];
    return a === b ? `<td class="c self" title="${a}'s real record">${fmt(r)}</td>`
      : `<td class="c" style="${shade(a, r)}" title="${a} with ${b}'s schedule: ${fmt(r)}">${fmt(r)}</td>`;
  }).join('')}<td class="sum">${avgPct(a).toFixed(3).replace(/^0/, '')}</td><td class="sum ${luck(a) >= 0.5 ? 'pos' : luck(a) <= -0.5 ? 'neg' : ''}">${luck(a) > 0 ? '+' : ''}${luck(a).toFixed(1)}</td></tr>`).join('');
  const foot = `<tr class="foot"><th class="rowh" style="color:var(--text-muted);font-weight:500">Others' W%</th>${order.map(b =>
    `<td title="How the other 11 teams do with ${b}'s schedule">${schedPct(b).toFixed(3).replace(/^0/, '')}</td>`).join('')}<td></td><td></td></tr>`;

  const byLuck = [...teams].sort((a, b) => luck(b) - luck(a));
  const maxL = Math.max(...byLuck.map(a => Math.abs(luck(a))), 1);
  const bars = byLuck.map(a => {
    const v = luck(a), w = (Math.abs(v) / maxL * 100).toFixed(1);
    return `<div class="ss-bar"><span>${managerTag(managers, a)}</span>
      <div class="neg-side">${v < 0 ? `<div class="fill" style="width:${w}%;background:#E0524A"></div>` : ''}</div>
      <div class="pos-side">${v > 0 ? `<div class="fill" style="width:${w}%;background:#4FA876"></div>` : ''}</div>
      <span class="v">${v > 0 ? '+' : ''}${v.toFixed(1)}</span></div>`;
  }).join('');
  const hardest = [...teams].sort((a, b) => schedPct(a) - schedPct(b));

  document.getElementById('ssRoot').innerHTML = `
    <p class="ss-intro">Through Week ${through}. Each row is a team's real weekly scores; each column is whose schedule he plays. The highlighted diagonal is his real record. The week a schedule's owner played that team is skipped, so swapped records cover ${through - 1} or ${through} games.</p>
    <section>
      <div class="ss-scroll"><table class="ss-grid"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>
      <div class="ss-legend"><span><i style="background:rgba(79,168,118,.45)"></i>Higher win rate than his real record</span><span><i style="background:rgba(224,82,74,.45)"></i>Lower</span><span><i style="outline:2px solid var(--live);outline-offset:-2px"></i>Real record</span></div>
      <p class="ss-note"><b>Avg W%</b> is his win rate across the other 11 schedules. <b>Luck</b> is his real wins minus the wins that rate predicts. <b>Others' W%</b> is how the other 11 teams do with that schedule: lower means a tougher schedule (hardest: ${hardest[0]}, ${schedPct(hardest[0]).toFixed(3).replace(/^0/, '')}; easiest: ${hardest.at(-1)}, ${schedPct(hardest.at(-1)).toFixed(3).replace(/^0/, '')}).</p>
    </section>
    <section>
      <h2 class="ss-h">Schedule Luck, in Wins</h2>
      <div class="ss-bars">${bars}</div>
      <p class="ss-note">Positive means his schedule has handed him more wins than it would most teams.</p>
    </section>`;

  if (embedded && parent !== window) {
    const box = document.querySelector('.container');
    const send = () => parent.postMessage({ nwlEmbedHeight: box.getBoundingClientRect().bottom + scrollY }, location.origin);
    new ResizeObserver(send).observe(document.body);
    send();
  }
})();
</script>
</body>
</html>
