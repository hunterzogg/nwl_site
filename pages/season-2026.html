<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Hub — National Wayzata League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=17">
<style>
.empty-state {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 14px;
  padding: 48px 24px; text-align: center; color: var(--text-muted);
}
.empty-state .headline { font-family: var(--font-display); color: var(--text); font-size: 1.1rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.matchup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.matchup-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.matchup-side { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 8px 10px 8px 14px; border-radius: 10px; background: var(--bg); }
.matchup-side::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--mc, var(--line-strong)); }
.matchup-side.winner { box-shadow: inset 0 0 0 1px rgba(242, 183, 5, 0.45); }
.matchup-side.winner .matchup-score { color: var(--live-bright); }
.matchup-side.loser .matchup-score { color: var(--text-muted); }
.matchup-score { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; line-height: 1; }
.matchup-proj { grid-column: 1 / -1; color: var(--text-muted); font-size: 0.72rem; font-family: var(--font-mono); }
.matchup-share { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bg); }
.matchup-share span { height: 100%; }
.matchup-share-label { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: -4px; }
.matchup-line { display: flex; gap: 6px; flex-wrap: wrap; }
.matchup-line .hx-pill b { color: var(--text); font-weight: 600; }
.division-title { color: var(--text-muted); font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; margin: 20px 0 8px; }
.division-title:first-child { margin-top: 0; }
.division-badge {
  display: inline-block; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600;
  letter-spacing: 0.03em; padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
}
.division-Gold { color: #D9B23C; background: rgba(217, 178, 60, 0.12); }
.division-Silver { color: #9A9A9A; background: rgba(154, 154, 154, 0.14); }
.division-Bronze { color: #A9784F; background: rgba(169, 120, 79, 0.14); }
/* Standings: one card per division */
.stand-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; }
.stand-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px 10px; }
.stand-card h3 { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; letter-spacing: 0.08em; margin: 10px 0 4px; }
.stand-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.stand-row:last-child { border-bottom: 0; }
.stand-row .pos { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); }
.stand-row .rec { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; text-align: right; }
.stand-row .meta { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); }
.stand-row .meta .hx-bar-track { flex: 1; }
.stand-row .meta .hx-pill { font-size: 0.66rem; }
/* Power rankings */
.rank-card { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 18px; margin-bottom: 10px; overflow: hidden; }
.rank-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--mc, var(--line-strong)); }
.rank-card.top3 { border-color: rgba(242, 183, 5, 0.35); background: linear-gradient(90deg, rgba(242, 183, 5, 0.07), rgba(242, 183, 5, 0) 40%), var(--surface); }
.rank-num-big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; line-height: 1; color: var(--live-bright); text-align: center; }
.rank-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rank-name .manager-tag { font-size: 1.2rem; font-weight: 600; }
.rank-name .manager-dot { width: 11px; height: 11px; }
.rank-trend { font-size: 0.72rem; font-family: var(--font-mono); font-weight: 600; white-space: nowrap; padding: 2px 8px; border-radius: 999px; background: var(--surface-raised); }
.rank-trend.up { color: #4FA876; background: rgba(79, 168, 118, 0.15); }
.rank-trend.down { color: #E0524A; background: rgba(224, 82, 74, 0.15); }
.rank-trend.same { color: var(--text-muted); }
.rank-body { min-width: 0; }
.rank-stats { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.rank-stats li { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); display: flex; flex-direction: column; gap: 1px; }
.rank-stats li b { color: var(--text); font-family: var(--font-mono); font-weight: 600; font-size: 0.92rem; letter-spacing: 0; text-transform: none; }
.rank-stats li small { font-size: 0.66rem; text-transform: none; letter-spacing: 0; }
@media (max-width: 560px) { .rank-card { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; } .rank-num-big { font-size: 1.9rem; } .rank-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.commentary-body { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; line-height: 1.75; font-size: 1rem; }
.commentary-body > * { max-width: 74ch; }
.commentary-body .cv { max-width: none; }
.commentary-body p { margin: 0 0 1em; white-space: pre-wrap; }
.commentary-body p:last-child { margin-bottom: 0; }
/* Inline commentary visuals (an entry's optional `visuals` array, placed via {{visual:id}} in body) */
.cv { margin: 6px 0 24px; padding: 16px 18px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
.cv-title { font-family: var(--font-display); font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 10px; color: var(--text); }
.cv-note { font-size: 0.76rem; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
.cv-table-wrap { overflow-x: auto; }
.cv table { width: 100%; border-collapse: collapse; font-size: 0.84rem; line-height: 1.4; }
.cv th { text-align: left; font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cv td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cv tr:last-child td { border-bottom: none; }
.cv .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cv td.em { color: var(--live-bright); font-weight: 600; }
.cv tr.hl td { background: rgba(61, 95, 224, 0.08); }
.cv-bars { display: flex; flex-direction: column; gap: 6px; }
.cv-bar-row { display: grid; grid-template-columns: minmax(90px, 30%) 1fr auto; gap: 10px; align-items: center; font-size: 0.82rem; }
.cv-bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cv-bar-track { height: 14px; }
.cv-bar-fill { height: 100%; border-radius: 0 3px 3px 0; background: var(--blue); min-width: 2px; }
.cv-bar-fill.tone-hot { background: var(--live-bright); }
.cv-bar-fill.tone-muted { background: var(--line-strong, #33405c); }
.cv-bar-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.8rem; min-width: 52px; text-align: right; }
.cv-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.74rem; color: var(--text-muted); margin-bottom: 10px; }
@media (max-width: 640px) { .commentary-body { padding: 16px; } .cv { padding: 12px 10px; } .cv th, .cv td { padding: 6px 5px; } .cv-bar-row { grid-template-columns: 96px 1fr auto; gap: 6px; } }
.cv-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.commentary-title { margin: 0 0 16px; font-size: clamp(1.4rem, 3.5vw, 1.9rem); line-height: 1.1; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.commentary-eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--live-bright); margin-bottom: 6px; }
.fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .fact-grid { grid-template-columns: 1fr; } }
.fact-card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 16px 20px; }
.fact-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line-strong); }
.fact-card.hot::before { background: var(--live-bright); } .fact-card.cold::before { background: var(--blue-bright); }
.fact-card.green::before { background: #4FA876; } .fact-card.red::before { background: #E0524A; }
.fact-card.hot { background: linear-gradient(135deg, rgba(242, 183, 5, 0.08), rgba(242, 183, 5, 0) 50%), var(--surface); }
.fact-card.wide { grid-column: 1 / -1; }
.fact-label {
  font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em;
  font-size: 0.68rem; color: var(--text-muted); margin: 0 0 8px;
}
.fact-headline { font-size: 1.1rem; font-weight: 600; margin: 0 0 6px; line-height: 1.35; }
.fact-headline .num { font-family: var(--font-display); font-size: 1.55em; font-weight: 600; letter-spacing: 0.01em; vertical-align: -0.06em; }
.fact-card.hot .fact-headline .num { color: var(--live-bright); }
.fact-card.cold .fact-headline .num { color: var(--blue-bright); }
.fact-card.green .fact-headline .num { color: #4FA876; }
.fact-card.red .fact-headline .num { color: var(--red); }
.fact-sub { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
.updated-note { color: var(--text-muted); font-size: 0.78rem; margin-bottom: 16px; }
.comments-section { margin-top: 28px; }
.comments-title {
  font-family: var(--font-display); font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 12px; border-left: 3px solid var(--live); padding-left: 10px;
}
.odds-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.odds-head p { margin: 0; color: var(--text-muted); font-size: 0.82rem; }
.odds-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.odds-table th { text-align: right; font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.odds-table th:first-child, .odds-table td:first-child { text-align: left; }
.odds-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--font-mono); white-space: nowrap; }
.odds-table td.team { font-family: var(--font-body); }
.odds-line td { padding: 0; border-bottom: 0; }
.odds-line > div, .odds-line td > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0; padding: 5px 10px; border-top: 2px solid var(--live); background: var(--live-bg); border-radius: 0 0 6px 6px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.74rem; }
.odds-line-in { color: var(--live-bright); } .odds-line-out { color: #E0524A; }
.odds-pct { position: relative; display: block; min-width: 64px; padding: 3px 6px; border-radius: 4px; z-index: 0; background: var(--bg); text-align: right; }
.odds-pct::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: var(--p); background: rgba(79,168,118,0.35); border-radius: 4px; z-index: -1; }
.odds-pct.title::before { background: rgba(242,183,5,0.26); }
.odds-delta { display: block; font-size: 0.68rem; } .odds-delta.up { color: #4FA876; } .odds-delta.down { color: #E0524A; } .odds-delta.flat { color: var(--text-muted); }
.odds-sub { font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); }
.odds-cards { display: none; }
@media (max-width: 640px) {
  .odds-wide { display: none; } .odds-cards { display: flex; flex-direction: column; gap: 8px; }
  .odds-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; }
  .odds-card .nums { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-family: var(--font-mono); font-size: 0.85rem; }
  .odds-card .nums div small { display: block; font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
}
.whatif { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.whatif h3 { margin: 0 0 4px; font-size: 1rem; }
.whatif p { margin: 0 0 10px; color: var(--text-muted); font-size: 0.82rem; }
.whatif-games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 8px; margin-top: 10px; }
.whatif-game { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); border-radius: 8px; padding: 4px; }
.whatif-game button { font: inherit; font-size: 0.85rem; border: 1px solid transparent; background: none; color: var(--text-muted); border-radius: 6px; padding: 7px 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.whatif-game button:hover { color: var(--text); }
.whatif-game button[aria-pressed="true"] { background: var(--surface-raised); color: var(--text); border-color: var(--live); }
.whatif-game button small { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
.whatif-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.whatif-reset { font: inherit; font-size: 0.8rem; background: none; border: 1px solid var(--line-strong); color: var(--text); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.mp { border-top: 1px solid var(--line); padding-top: 8px; font-size: 0.84rem; }
.mp summary { cursor: pointer; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.78rem; color: var(--live-bright); list-style: none; }
.mp summary::-webkit-details-marker { display: none; }
.mp summary::before { content: '▸ '; } .mp[open] summary::before { content: '▾ '; }
.mp-prob { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin: 10px 0; font-size: 0.8rem; }
.mp-prob b { font-family: var(--font-mono); }
.mp-probbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.mp-grid { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; }
.mp-k { font-family: var(--font-mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding-top: 2px; }
.mp-two { display: flex; flex-direction: column; gap: 3px; }
.mp-muted { color: var(--text-muted); }
.mp-f { display: inline-block; width: 16px; text-align: center; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; border-radius: 3px; margin-left: 2px; }
.mp-f.W { background: rgba(79,168,118,0.2); color: #4FA876; } .mp-f.L { background: rgba(224,82,74,0.18); color: #E0524A; } .mp-f.T { background: var(--surface-raised); }
.mp-watch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.mp-watch ul { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.mp-inj { color: #E0524A; font-size: 0.72rem; }
@media (max-width: 420px) { .mp-grid { grid-template-columns: 1fr; gap: 2px; } .mp-k { padding-top: 6px; } .mp-watch { grid-template-columns: 1fr; } }
.sg-card { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.sg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sg-head h3 { margin: 0; font-size: 1rem; }
.sg-key { margin: 4px 0 10px; font-size: 0.78rem; color: var(--text-muted); }
.sg-key b { color: var(--text); }
.sg-rows { display: flex; flex-direction: column; }
.sg-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 28px 200px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
.sg-row:last-child { border-bottom: 0; }
.sg-row.clean { opacity: 0.85; }
.sg-icons { font-size: 0.95rem; letter-spacing: 1px; overflow: hidden; white-space: nowrap; }
.sg-n { font-family: var(--font-mono); font-weight: 600; text-align: right; }
.sg-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.sg-calls { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 0.84rem; color: var(--text-muted); }
.sg-calls b { color: var(--text); }
.sg-kind { display: inline-block; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.7rem; padding: 1px 6px; border-radius: 4px; }
.sg-kind.double { background: rgba(224,82,74,0.15); color: #E0524A; }
.sg-kind.snorkel { background: var(--live-bg); color: var(--live-bright); }
.sg-hurt { font-size: 0.7rem; color: var(--text-muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }
@media (max-width: 560px) { .sg-row { grid-template-columns: minmax(0, 1fr) auto 24px; } .sg-tags { grid-column: 1 / -1; justify-content: flex-start; } .sg-tags:empty { display: none; } }
</style>
</head>
<body>

<div class="container" style="padding-top: 24px;">
  <header class="hx-hero live compact">
    <div class="hx-eyebrow"><span class="nav-live-dot"></span> 2026 Hub</div>
    <h1>Weekly Hub</h1>
    <p>This week's matchups, standings, power rankings, recap and Brian's Fun Facts. Updated throughout the season.</p>
  </header>

  <div class="rw-banner" id="recordWatch" hidden></div>

  <div class="tab-row live">
    <button class="tab-btn active" data-tab="matchups">Matchups</button>
    <button class="tab-btn" data-tab="standings">Standings</button>
    <button class="tab-btn" data-tab="odds">Playoff Race</button>
    <button class="tab-btn" data-tab="power">Power Rankings</button>
    <button class="tab-btn" data-tab="commentary">Commentary</button>
    <button class="tab-btn" data-tab="funfacts">Brian's Fun Facts</button>
  </div>

  <div class="panel active" id="panel-matchups">
    <div class="controls-row">
      <select id="matchupsWeek"></select>
    </div>
    <section class="twh compact" id="historyWeek" hidden aria-label="This week in NWL history"></section>
    <div id="matchupsContent">
      <div class="matchup-grid">
        <div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-standings">
    <div id="standingsContent">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>
    </div>
  </div>

  <div class="panel" id="panel-odds">
    <div id="oddsContent">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>
    </div>
    <div class="methodology" style="margin-top: 18px;">
      <details>
        <summary>Show methodology</summary>
        <div style="margin-top: 8px;" id="oddsMethod"></div>
      </details>
    </div>
  </div>

  <div class="panel" id="panel-power">
    <div class="controls-row">
      <select id="powerWeek"></select>
    </div>
    <div id="powerContent">
      <div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div>
    </div>
  </div>

  <div class="panel" id="panel-commentary">
    <div class="controls-row">
      <select id="commentaryWeek"></select>
    </div>
    <div id="commentaryContent">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line"></div><div class="skeleton-line"></div>
    </div>
  </div>

  <div class="panel" id="panel-funfacts">
    <div class="controls-row">
      <select id="funFactsWeek"></select>
    </div>
    <div id="funFactsContent">
      <div class="fact-grid">
        <div class="skeleton-block"></div><div class="skeleton-block"></div>
        <div class="skeleton-block"></div><div class="skeleton-block"></div>
      </div>
    </div>

<script>
let managers = [];

let schedule = null, history = [], weeklyHist = [], seasonsHist = [], zeroStarts = null;
const DIVISION_ORDER = ['Gold', 'Silver', 'Bronze'];

function emptyState(headline, sub) {
  return `<div class="empty-state"><div class="headline">${headline}</div><p style="margin:0;">${sub}</p></div>`;
}

function divisionBadge(manager) {
  const div = managerDivision[manager];
  if (!div) return '';
  return `<span class="division-badge division-${div}">${div}</span>`;
}

function managerTagWithDivision(mgrList, name) {
  return managerTag(mgrList, name) + divisionBadge(name);
}

function populateWeekSelect(selectId, weeks, onChange) {
  const sel = document.getElementById(selectId);
  if (weeks.length === 0) {
    sel.innerHTML = '<option value="">No weeks yet</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = weeks.map(w => `<option value="${w}">Week ${w}</option>`).join('');
  sel.value = weeks[weeks.length - 1];
  sel.onchange = onChange;
}

function renderMatchups() {
  const week = document.getElementById('matchupsWeek').value;
  const entry = matchups.find(m => String(m.week) === String(week));
  if (!entry || !entry.games.length) {
    document.getElementById('matchupsContent').innerHTML = emptyState(

    <p class="updated-note">Last updated ${new Date(entry.updated_at).toLocaleString()}</p>

        const done = g.winner === 'HOME' || g.winner === 'AWAY' || g.winner === 'TIE';

        const homeWin = g.winner === 'HOME', awayWin = g.winner === 'AWAY';
        const cls = (win, lose) => win ? 'winner' : lose ? 'loser' : '';
        // Share bar: actual points once scoring has started, projections before kickoff
        const useProj = !started && g.home_projected != null && g.away_projected != null;
        const hv = useProj ? g.home_projected : g.home_score, av = useProj ? g.away_projected : (g.away_score || 0);
        const tot = hv + av, hp = tot ? hv / tot * 100 : 50;

            <span class="matchup-score">${score != null ? score.toFixed(1) : ''}</span>
            ${proj != null ? `<div class="matchup-proj">proj ${proj.toFixed(1)}</div>` : ''}
          </div>`;
        return `
        <div class="matchup-card hover-lift">
          ${side(g.home_manager, g.home_score, g.home_projected, cls(homeWin, awayWin))}
          ${side(g.away_manager, g.away_score, g.away_projected, cls(awayWin, homeWin))}
          ${g.away_manager && tot ? `<div class="matchup-share" role="img" aria-label="${useProj ? 'Projected' : 'Points'} share"><span style="width:${hp.toFixed(1)}%;background:${managerColor(managers, g.home_manager)}"></span><span style="width:${(100 - hp).toFixed(1)}%;background:${managerColor(managers, g.away_manager)}"></span></div>
            <div class="matchup-share-label"><span>${useProj ? 'Projected' : done ? 'Final' : 'Live'}</span><span>${hp.toFixed(0)}% – ${(100 - hp).toFixed(0)}%</span></div>` : ''}
          ${g.line ? `
            <div class="matchup-line">
              <span class="hx-pill">Line <b>${g.line.favorite}${g.line.spread > 0 ? ' −' + g.line.spread.toFixed(1) : ' PK'}</b></span>
              <span class="hx-pill">O/U <b>${g.line.over_under.toFixed(1)}</b></span>
            </div>
          ` : ''}
          ${!done && g.away_manager ? previewHTML(g, entry.week) : ''}

      }).join('')}

}

function renderStandings() {

// Shotgun counter. League lingo: a starter who scores exactly 0 is a shotgun, a negative score is a snorkel,
// and two zeros in one week is a double barrel. Head Coaches don't count. Data: data/season_2026/zero_starts.json,
// written by the weekly ESPN pull (scripts/fetch_espn_week.py).
function shotgunHTML() {
  if (!zeroStarts || !zeroStarts.weeks) return '';
  const T = {}, calls = [];
  const blank = () => ({ shotgunWeeks: 0, shotguns: 0, doubles: 0, snorkels: 0 });
  (standings.standings || []).forEach(s => { T[s.manager] = blank(); });
  const hurtTag = z => z.hurt ? ' <span class="sg-hurt">hurt in game</span>' : '';
  Object.entries(zeroStarts.weeks).sort((a, b) => a[0] - b[0]).forEach(([wk, rows]) => {
    const by = {};
    rows.forEach(z => (by[z.manager] ||= []).push(z));
    Object.entries(by).forEach(([m, zs]) => {
      const t = (T[m] ||= blank());
      const zeros = zs.filter(z => z.points === 0), negs = zs.filter(z => z.points < 0);
      if (zeros.length) { t.shotgunWeeks++; t.shotguns += zeros.length; }
      if (zeros.length >= 2) { t.doubles++; calls.push({ wk: +wk, kind: 'double', m, html: `${zeros.map(z => esc(z.player) + hurtTag(z)).join(zeros.length > 2 ? ', ' : ' and ')}${zeros.length > 2 ? ` (${zeros.length} zeros)` : ''}` }); }
      negs.forEach(z => { t.snorkels++; calls.push({ wk: +wk, kind: 'snorkel', m, html: `${esc(z.player)} (${z.points.toFixed(1).replace('-', '−')})${hurtTag(z)}` }); });
    });
  });
  const rows = Object.entries(T).sort((a, b) => b[1].shotgunWeeks - a[1].shotgunWeeks || b[1].snorkels - a[1].snorkels || b[1].doubles - a[1].doubles || a[0].localeCompare(b[0]));
  const icons = n => n ? '🍺'.repeat(Math.min(n, 8)) + (n > 8 ? ` ×${n}` : '') : '<span class="hx-muted">—</span>';
  const label = { double: 'Double barrel', snorkel: 'Snorkel' };
  return `<section class="sg-card">
    <div class="sg-head"><h3>Shotgun Counter</h3><span class="hx-muted">through week ${zeroStarts.through_week}</span></div>
    <p class="sg-key"><b>Shotgun</b>: starting a player who scores 0. <b>Double barrel</b>: two zeros in one week. <b>Snorkel</b>: a negative score. Head Coaches don't count.</p>
    <div class="sg-rows">${rows.map(([m, t]) => `<div class="sg-row${t.shotgunWeeks || t.snorkels ? '' : ' clean'}">
        <span>${managerTag(managers, m)}</span><span class="sg-icons" title="${t.shotgunWeeks} week${t.shotgunWeeks === 1 ? '' : 's'} with a shotgun">${icons(t.shotgunWeeks)}</span>
        <span class="sg-n">${t.shotgunWeeks}</span>
        <span class="sg-tags">${t.doubles ? `<span class="hx-pill down">${t.doubles > 1 ? t.doubles + '× ' : ''}double barrel</span>` : ''}${t.snorkels ? `<span class="hx-pill gold">${t.snorkels > 1 ? t.snorkels + '× ' : ''}snorkel</span>` : ''}</span>
      </div>`).join('')}</div>
    ${calls.length ? `<ul class="sg-calls">${calls.sort((a, b) => b.wk - a.wk).map(c => `<li><span class="sg-kind ${c.kind}">${label[c.kind]}</span> <b>${esc(c.m)}</b>, week ${c.wk}: ${c.html}</li>`).join('')}</ul>` : ''}
  </section>`;
}

            ${r.remaining_sos_rank ? `<li>Remaining SoS<b>${sosLabel(r.remaining_sos_rank, r.sos_total)}</b><small>next ${r.remaining_games} games</small></li>` : ''}

  `).join('');
}

// Spots moved since the prior published week, with a fire/snowflake for a big swing (more than
// 2 spots either way). delta is 0 (not null) for a manager's first-ever ranked week, which
// renders the same as "no movement" - there's nothing to compare against yet either way.
function trendLabel(r) {
  const delta = r.delta || 0;
  if (delta === 0) {
    const weeks = r.rank_streak || 1;
    return `&#8212; ${weeks} wk${weeks === 1 ? '' : 's'}`;
  }
  const arrow = delta > 0 ? '&#9650;' : '&#9660;';
  const emoji = delta > 2 ? ' \u{1F525}' : delta < -2 ? ' ❄️' : '';
  return `${arrow}${Math.abs(delta)}${emoji}`;
}

// "1st (hardest)" / "12th (easiest)" only at the two extremes, plain ordinal otherwise.
function sosLabel(rank, total) {
  if (rank === 1) return `${ordinal(rank)} (hardest)`;
  if (rank === total) return `${ordinal(rank)} (easiest)`;
  return ordinal(rank);
}

function ordinal(n) {
  const rem100 = n % 100;
  if (rem100 >= 11 && rem100 <= 13) return `${n}th`;
  switch (n % 10) {
    case 1: return `${n}st`;
    case 2: return `${n}nd`;
    case 3: return `${n}rd`;
    default: return `${n}th`;
  }
}

  `;
}

const GISCUS_REPO = 'hunterzogg/nwl_site';
const GISCUS_REPO_ID = 'R_kgDOTSHvaA';

const GISCUS_CATEGORY_ID = 'DIC_kwDOTSHvaM4DAyKl';

// Commentary body: paragraphs split on blank lines. A paragraph that is exactly {{visual:<id>}}
// is replaced by the matching entry in the entry's optional `visuals` array, so a week's recap can
// carry tables/bar charts inline. Visual shapes (hand-authored in commentary.json):
//   {id, type: 'table', title, note?, columns: [{key, label, num?, manager?}], rows: [{...cells, _hl?, _em?: [keys]}]}
//   {id, type: 'bar', title, note?, unit?, legend?: [{label, tone}], bars: [{label, manager?, value, tone?: 'hot'|'muted'}]}
function commentaryBodyHTML(entry) {
  const visuals = {};
  (entry.visuals || []).forEach(v => { visuals[v.id] = v; });
  return entry.body.split(/\n\s*\n/).map(par => {
    const m = par.trim().match(/^\{\{visual:([\w-]+)\}\}$/);
    if (m) return visuals[m[1]] ? commentaryVisualHTML(visuals[m[1]]) : '';
    return `<p>${par}</p>`;
  }).join('');
}

function commentaryVisualHTML(v) {
  const title = v.title ? `<div class="cv-title">${v.title}</div>` : '';
  const note = v.note ? `<div class="cv-note">${v.note}</div>` : '';
  if (v.type === 'table') {
    const head = v.columns.map(c => `<th class="${c.num ? 'num' : ''}">${c.label}</th>`).join('');
    const body = v.rows.map(r => `<tr class="${r._hl ? 'hl' : ''}">${v.columns.map(c => {
      const val = r[c.key] === undefined || r[c.key] === null ? '' : r[c.key];
      const cls = [c.num ? 'num' : '', (r._em || []).includes(c.key) ? 'em' : ''].join(' ').trim();
      return `<td class="${cls}">${c.manager && val ? managerTag(managers, val) : val}</td>`;
    }).join('')}</tr>`).join('');
    return `<div class="cv">${title}<div class="cv-table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${note}</div>`;
  }
  if (v.type === 'bar') {
    const max = Math.max(...v.bars.map(b => b.value), 0) || 1;
    const legend = v.legend ? `<div class="cv-legend">${v.legend.map(l =>
      `<span><i class="cv-bar-fill${l.tone ? ' tone-' + l.tone : ''}"></i>${l.label}</span>`).join('')}</div>` : '';
    const bars = v.bars.map(b => `
      <div class="cv-bar-row">
        <span class="cv-bar-label">${b.manager ? managerTag(managers, b.manager) + (b.label ? ' ' + b.label : '') : b.label}</span>
        <div class="cv-bar-track"><div class="cv-bar-fill${b.tone ? ' tone-' + b.tone : ''}" style="width:${(b.value / max * 100).toFixed(1)}%"></div></div>
        <span class="cv-bar-value">${b.display || b.value}${v.unit ? ' ' + v.unit : ''}</span>
      </div>`).join('');
    return `<div class="cv">${title}${legend}<div class="cv-bars">${bars}</div>${note}</div>`;
  }
  return '';
}

function renderCommentary() {
  const week = document.getElementById('commentaryWeek').value;
  const entry = commentary.find(c => String(c.week) === String(week) && c.published);
  if (!entry) {

  script.async = true;
  document.getElementById('giscus-container').appendChild(script);
}

/* ---------- Matchup previews (all computed, nothing hand-written) ---------- */
let _playoffStart = null;
function playoffStart(season) { // first playoff week of a past season, from weekly_scores game_type
  if (!_playoffStart) { _playoffStart = {}; weeklyHist.forEach(r => { if (r.game_type === 'playoff') { const w = +r.week; if (!_playoffStart[r.season] || w < _playoffStart[r.season]) _playoffStart[r.season] = w; } }); }
  return _playoffStart[season] || 99;
}
// a playoff meeting = a game in the playoff weeks between two teams that both finished top 6 that season
// (weeks 15-17 also hold consolation games, so the week alone isn't enough)
const _finish = {};
function finish(season, m) { const k = season + '|' + m; if (!(k in _finish)) { const r = seasonsHist.find(x => x.season === String(season) && x.manager === m); _finish[k] = r ? +r.final_finish : 99; } return _finish[k]; }
function h2h(a, b) {
  const games = history.filter(r => (r.winner === a && r.loser === b) || (r.winner === b && r.loser === a))
    .map(r => ({ season: +r.season, week: +r.week, winner: r.winner, ws: +r.winning_score, ls: +r.losing_score, playoff: +r.week >= playoffStart(r.season) && finish(r.season, a) <= 6 && finish(r.season, b) <= 6 }));
  (schedule ? schedule.games : []).filter(g => ['HOME', 'AWAY'].includes(g.winner) && ((g.home === a && g.away === b) || (g.home === b && g.away === a)))
    .forEach(g => { const hw = g.winner === 'HOME'; games.push({ season: 2026, week: g.week, winner: hw ? g.home : g.away, ws: hw ? g.home_score : g.away_score, ls: hw ? g.away_score : g.home_score, playoff: false }); });
  games.sort((x, y) => x.season - y.season || x.week - y.week);
  const w = m => games.filter(x => x.winner === m).length;
  let streak = 0, holder = null; for (let i = games.length - 1; i >= 0; i--) { if (!holder) holder = games[i].winner; if (games[i].winner !== holder) break; streak++; }
  return { n: games.length, a: w(a), b: w(b), po: games.filter(x => x.playoff), last: games[games.length - 1], holder, streak };
}
function form(m, beforeWeek) {
  const gs = (schedule ? schedule.games : []).filter(g => g.week < beforeWeek && ['HOME', 'AWAY', 'TIE'].includes(g.winner) && (g.home === m || g.away === m)).slice(-3);
  return gs.map(g => { const home = g.home === m, pf = home ? g.home_score : g.away_score, pa = home ? g.away_score : g.home_score; return { r: g.winner === 'TIE' ? 'T' : (g.winner === 'HOME') === home ? 'W' : 'L', pf, pa }; });
}
function watchList(m) {
  if (!D || !team(m)) return [];
  return lineup(team(m).players, p => p.wk || 0).st.filter(x => P(x[1]).pos !== 'HC').sort((x, y) => y[2] - x[2]).slice(0, 3).map(x => P(x[1]));
}
function previewHTML(g, week) {
  const a = g.home_manager, b = g.away_manager;
  const sd = (D && D.score_sd) || 25;
  const pA = g.home_projected != null && g.away_projected != null ? Phi((g.home_projected - g.away_projected) / (sd * Math.SQRT2)) : null;
  const H = h2h(a, b);
  const latest = powerRankings.filter(p => p.published).slice(-1)[0];
  const pr = m => latest ? (latest.rankings.find(r => r.manager === m) || {}) : {};
  const formStr = m => form(m, week).map(f => `<span class="mp-f ${f.r}" title="${f.pf.toFixed(1)}–${f.pa.toFixed(1)}">${f.r}</span>`).join('') || '<span class="mp-muted">—</span>';
  const watch = m => watchList(m).map(p => `<li>${posTag(p.pos)} ${esc(p.name)} <span class="mp-muted">${(p.wk || 0).toFixed(1)}</span>${p.inj ? ` <span class="mp-inj">${esc(p.inj.replace('_', ' ').toLowerCase())}</span>` : ''}</li>`).join('');
  const last = H.last ? `${H.last.season} wk ${H.last.week}: ${esc(H.last.winner)} ${H.last.ws.toFixed(H.last.ws % 1 ? 1 : 0)}–${H.last.ls.toFixed(H.last.ls % 1 ? 1 : 0)}${H.last.playoff ? ' (playoffs)' : ''}` : 'First meeting';
  const key = NWL_SIM.key({ week, home: a });
  return `<details class="mp" data-mpkey="${key}" data-a="${esc(a)}" data-b="${esc(b)}"><summary>Preview</summary>
    ${pA != null ? `<div class="mp-prob"><span>${esc(a)} <b>${Math.round(pA * 100)}%</b></span><div class="mp-probbar"><span style="width:${(pA * 100).toFixed(1)}%;background:${managerColor(managers, a)}"></span><span style="width:${(100 - pA * 100).toFixed(1)}%;background:${managerColor(managers, b)}"></span></div><span><b>${Math.round(100 - pA * 100)}%</b> ${esc(b)}</span></div>` : ''}
    <div class="mp-grid">
      <div class="mp-k">All-time</div><div>${H.n ? `<b>${esc(a)} ${H.a}–${H.b} ${esc(b)}</b>${H.po.length ? ` · ${H.po.length} playoff meeting${H.po.length === 1 ? '' : 's'}` : ''}${H.streak > 1 ? ` · ${esc(H.holder)} has won ${H.streak} straight` : ''}` : 'Never met'}</div>
      <div class="mp-k">Last meeting</div><div>${last}</div>
      <div class="mp-k">Form</div><div class="mp-two"><span>${esc(a)} ${formStr(a)}${pr(a).rank ? ` <span class="mp-muted">· power #${pr(a).rank}</span>` : ''}</span><span>${esc(b)} ${formStr(b)}${pr(b).rank ? ` <span class="mp-muted">· power #${pr(b).rank}</span>` : ''}</span></div>
      <div class="mp-k">Stakes</div><div class="mp-stakes">${oddsReady() ? '<span class="mp-muted">Simulating…</span>' : '<span class="mp-muted">Playoff odds unavailable</span>'}</div>
    </div>
    ${D ? `<div class="mp-watch"><div><div class="mp-k">${esc(a)} to watch</div><ul>${watch(a)}</ul></div><div><div class="mp-k">${esc(b)} to watch</div><ul>${watch(b)}</ul></div></div>` : ''}
  </details>`;
}
// Stakes: playoff odds with a win vs. a loss, simulated the first time a preview is opened
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.mp') || !d.open || d.dataset.done || !oddsReady()) return;
  d.dataset.done = 1;
  setTimeout(() => {
    if (!oddsBase) computeOddsBase();
    const k = d.dataset.mpkey, a = d.dataset.a, b = d.dataset.b;
    const home = NWL_SIM.run(5000, { [k]: 'HOME' }), away = NWL_SIM.run(5000, { [k]: 'AWAY' });
    const line = (m, win, lose) => `<span><b>${esc(m)}</b> playoffs ${pct(lose[m].playoff)} → <b>${pct(win[m].playoff)}</b> with a win</span>`;
    d.querySelector('.mp-stakes').innerHTML = `<div class="mp-two">${line(a, home, away)}${line(b, away, home)}</div>`;
  }, 10);
}, true);

/* ---------- Playoff Race tab (simulator in assets/js/nwl_sim.js) ---------- */
let oddsBase = null, oddsPrev = null, oddsLocks = {}, oddsWeek = null;
// The What-if picker is archived until the playoff race tightens: it comes back by itself once ESPN's
// current week reaches this (per Hunter, Oct 17). The code below is unchanged, just not shown before then.
const WHATIF_FROM_WEEK = 12;
const whatIfOpen = () => schedule && (schedule.current_week || 0) >= WHATIF_FROM_WEEK;
const pct = x => x >= 0.995 && x < 1 ? '>99%' : x > 0 && x < 0.005 ? '<1%' : Math.round(x * 100) + '%';
function oddsReady() { return schedule && schedule.games && schedule.games.length && D; }
function computeOddsBase() {
  // "before" odds: the same model with the last completed week's games treated as unplayed
  const lastDone = Math.max(0, ...schedule.games.filter(g => ['HOME', 'AWAY', 'TIE'].includes(g.winner)).map(g => g.week));
  if (lastDone > 1) { NWL_SIM.setup(schedule, lastDone); oddsPrev = { week: lastDone, odds: NWL_SIM.run(6000) }; }
  NWL_SIM.setup(schedule);
  oddsBase = NWL_SIM.run(10000);
  const rem = NWL_SIM.state().remaining;
  oddsWeek = rem.length ? Math.min(...rem.map(g => g.week)) : null;
}
function renderOdds() {
  const el = document.getElementById('oddsContent');
  if (!oddsReady()) { el.innerHTML = emptyState('The playoff race isn\'t available yet', 'They appear once the weekly data pull has saved the season schedule.'); return; }
  if (!oddsBase) computeOddsBase();
  const locked = Object.keys(oddsLocks).length;
  const odds = locked ? NWL_SIM.run(10000, oddsLocks) : oddsBase;
  const S = NWL_SIM.state();
  const rec = {}; S.teams.forEach(t => rec[t] = [0, 0, 0]);
  S.played.forEach(g => { if (g.winner === 'HOME') { rec[g.home][0]++; rec[g.away][1]++; } else if (g.winner === 'AWAY') { rec[g.away][0]++; rec[g.home][1]++; } else { rec[g.home][2]++; rec[g.away][2]++; } });
  const recStr = t => rec[t][0] + '-' + rec[t][1] + (rec[t][2] ? '-' + rec[t][2] : '');
  const seedOf = NWL_SIM.projectedSeeds(odds);
  const rows = [...S.teams].sort((a, b) => seedOf[a] - seedOf[b]);
  const ref = locked ? oddsBase : (oddsPrev && oddsPrev.odds);
  const delta = (t, k) => { if (!ref) return ''; const d = Math.round((odds[t][k] - ref[t][k]) * 100); return `<span class="odds-delta ${d > 0 ? 'up' : d < 0 ? 'down' : 'flat'}">${d > 0 ? '▲' + d : d < 0 ? '▼' + Math.abs(d) : '—'}</span>`; };
  const likely = t => `#${seedOf[t]} seed`;
  const cell = (t, k, cls = '') => `<span class="odds-pct ${cls}" style="--p:${(odds[t][k] * 100).toFixed(1)}%">${pct(odds[t][k])}</span>${delta(t, k)}`;
  const deltaLabel = locked ? 'vs. no picks' : oddsPrev ? `vs. before week ${oddsPrev.week}` : '';
  el.innerHTML = `<div class="odds-head"><p>${(10000).toLocaleString()} simulated seasons${locked ? ` with your ${locked} pick${locked === 1 ? '' : 's'}` : ''} · ${S.remaining.length} regular-season games left${deltaLabel ? ' · arrows ' + deltaLabel : ''}</p></div>
    <div class="odds-wide" style="overflow-x:auto"><table class="odds-table"><thead><tr><th>Team</th><th>Record</th><th>Proj. W</th><th>Playoffs</th><th>Bye</th><th>Division</th><th>#1 seed</th><th>Final</th><th>Title</th><th>Proj. seed</th></tr></thead><tbody>
      ${rows.map((t, i) => `${i === S.poTeams ? playoffLine('tr') : ''}<tr class="${i >= S.poTeams ? 'out' : ''}"><td class="team">${managerTagWithDivision(managers, t)}</td><td>${recStr(t)}</td><td>${odds[t].wins.toFixed(1)}</td><td>${cell(t, 'playoff')}</td><td>${cell(t, 'bye')}</td><td>${cell(t, 'divWin')}</td><td>${cell(t, 'seed1')}</td><td>${cell(t, 'final')}</td><td>${cell(t, 'title', 'title')}</td><td class="odds-sub">${likely(t)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="odds-cards">${rows.map((t, i) => `${i === S.poTeams ? playoffLine('div') : ''}<div class="odds-card${i >= S.poTeams ? ' out' : ''}"><div>${managerTagWithDivision(managers, t)} <span class="odds-sub">${recStr(t)} · proj ${odds[t].wins.toFixed(1)} W</span></div><div class="odds-sub">${likely(t)}</div>
      <div class="nums"><div><small>Playoffs</small>${cell(t, 'playoff')}</div><div><small>Bye</small>${cell(t, 'bye')}</div><div><small>Division</small>${cell(t, 'divWin')}</div><div><small>Title</small>${cell(t, 'title', 'title')}</div></div></div>`).join('')}</div>
    ${whatIfHTML()}`;
  document.getElementById('oddsMethod').innerHTML = `<p><strong>Model.</strong> Each manager's weekly score is drawn from a normal distribution. Its average blends his actual 2026 points per game with his projected starting lineup (the same rest-of-season blend the Trade Calculator uses, scaled to the league's real scoring level), with the projection counting ${Math.round(S.wProj * 100)}% right now. It counts more early in the season and less as games are played. The spread is the league's ${S.sd}-point weekly score spread.</p>
    <p><strong>Seeding.</strong> The three division winners take seeds 1–3 by record, then the three best remaining records are the wild cards (seeds 4–6). Seeds 7–12 are the remaining teams by record. Total points break ties. <em>Proj. seed</em> applies these same rules to each team's projected wins and points, so every seed from 1 to 12 appears once; the table is sorted by it, with the dashed line after the last playoff seed. Seeds 1 and 2 get the week ${S.playoffWeeks[0]} bye. Week ${S.playoffWeeks[0]}: 3 vs 6 and 4 vs 5. Week ${S.playoffWeeks[1]}: #1 plays the lowest remaining seed, #2 the other. Week ${S.playoffWeeks[2]}: the final.</p>
    <p><strong>Arrows</strong> compare with the same model before last week's games were played${whatIfOpen() ? ', or with no picks when you\'ve picked winners below' : ''}. Games in progress are simulated from scratch. The random numbers are fixed, so the odds only change when results or rosters do.</p>`;
}
// the break between the last playoff seed and the first team out
function playoffLine(kind) {
  const label = `<span class="odds-line-in">▲ In the playoffs</span><span class="odds-line-out">Out ▼</span>`;
  return kind === 'tr' ? `<tr class="odds-line" aria-hidden="true"><td colspan="10"><div>${label}</div></td></tr>` : `<div class="odds-line" aria-hidden="true"><div>${label}</div></div>`;
}
function whatIfHTML() {
  const S = NWL_SIM.state(); if (!S.remaining.length || !whatIfOpen()) return '';
  const weeks = [...new Set(S.remaining.map(g => g.week))].sort((a, b) => a - b);
  const games = S.remaining.filter(g => g.week === oddsWeek);
  const btn = (g, side) => { const mgr = side === 'HOME' ? g.home : g.away, on = oddsLocks[NWL_SIM.key(g)] === side;
    return `<button type="button" data-lock="${NWL_SIM.key(g)}" data-side="${side}" aria-pressed="${on}">${managerTag(managers, mgr)}</button>`; };
  return `<section class="whatif"><div class="whatif-bar"><div><h3>What if?</h3><p>Pick winners and the odds above re-run with those results locked in.</p></div>
      ${Object.keys(oddsLocks).length ? `<button type="button" class="whatif-reset" data-resetlocks>Clear ${Object.keys(oddsLocks).length} pick${Object.keys(oddsLocks).length === 1 ? '' : 's'}</button>` : ''}</div>
    <div class="hx-chips" style="margin:6px 0 0">${weeks.map(w => `<button type="button" class="hx-chip" aria-pressed="${w === oddsWeek}" data-oddsweek="${w}">Week ${w}${S.remaining.some(g => g.week === w && oddsLocks[NWL_SIM.key(g)]) ? ' •' : ''}</button>`).join('')}</div>
    <div class="whatif-games">${games.map(g => `<div class="whatif-game">${btn(g, 'HOME')}${btn(g, 'AWAY')}</div>`).join('')}</div></section>`;
}
document.addEventListener('click', e => {
  const l = e.target.closest('[data-lock]');
  if (l) { const k = l.dataset.lock; if (oddsLocks[k] === l.dataset.side) delete oddsLocks[k]; else oddsLocks[k] = l.dataset.side; renderOdds(); return; }
  const w = e.target.closest('[data-oddsweek]'); if (w) { oddsWeek = +w.dataset.oddsweek; renderOdds(); return; }
  if (e.target.closest('[data-resetlocks]')) { oddsLocks = {}; renderOdds(); }
});

async function init() {
  managers = await getManagers();
  [matchups, standings, powerRankings, commentary, funFacts] = await Promise.all([
    loadDataSafe('season_2026/matchups', []),
    loadDataSafe('season_2026/standings', null),
    loadDataSafe('season_2026/power_rankings', []),
    loadDataSafe('season_2026/commentary', []),
    loadDataSafe('season_2026/fun_facts', []),
  ]);
  [schedule, D, history, weeklyHist] = await Promise.all([loadDataSafe('season_2026/schedule', null), loadDataSafe('season_2026/trade_values', null), loadDataSafe('matchup_results', []), loadDataSafe('weekly_scores', [])]);
  seasonsHist = await loadDataSafe('team_seasons_regular', []);
  zeroStarts = await loadDataSafe('season_2026/zero_starts', null);

  managerDivision = {};
  if (standings && standings.standings) {
    standings.standings.forEach(s => { managerDivision[s.manager] = s.division; });
  }

  const matchupWeeks = matchups.map(m => m.week);
  populateWeekSelect('matchupsWeek', matchupWeeks, renderMatchups);

  const powerWeeks = powerRankings.filter(p => p.published).map(p => p.week);
  populateWeekSelect('powerWeek', powerWeeks, renderPower);

  const commentaryWeeks = commentary.filter(c => c.published).map(c => c.week);
  populateWeekSelect('commentaryWeek', commentaryWeeks, renderCommentary);

  const funFactsWeeks = funFacts.filter(f => f.published).map(f => f.week);
  populateWeekSelect('funFactsWeek', funFactsWeeks, renderFunFacts);

  renderMatchups();
  renderStandings();
  renderPower();
  renderCommentary();
  renderFunFacts();
  renderOdds();
  NWL_REC.renderRecordWatch(document.getElementById('recordWatch'), NWL_REC.recordWatch({ weekly: weeklyHist, matchups: history, schedule, live: matchups }));
  Promise.all([loadDataSafe('player_week_highlights', []), loadDataSafe('trades', []), loadDataSafe('transactions_with_dates', [])]).then(([highlights, trades, tx]) => {
    const week = (schedule && schedule.current_week) || (matchups.length ? matchups[matchups.length - 1].week : 1);
    NWL_REC.renderHistory(document.getElementById('historyWeek'), NWL_REC.historyThisWeek({ weekly: weeklyHist, matchups: history, seasons: seasonsHist, highlights, trades, tx, week, today: new Date(), prefix: '../' }), week, true);
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });
}

renderNav('2026 hub');
init();
</script>
