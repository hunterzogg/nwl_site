<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Hub — National Wayzata League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=15">
<style>
.empty-state {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 14px;
  padding: 48px 24px; text-align: center; color: var(--text-muted);
}
.empty-state .headline { font-family: var(--font-display); color: var(--text); font-size: 1.1rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.matchup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.matchup-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.matchup-side { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 8px 10px 8px 14px; border-radius: 10px; background: var(--bg); }
.matchup-side::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--mc, var(--line-strong)); }
.matchup-side.winner { box-shadow: inset 0 0 0 1px rgba(242, 183, 5, 0.45); }
.matchup-side.winner .matchup-score { color: var(--live-bright); }
.matchup-side.loser .matchup-score { color: var(--text-muted); }
.matchup-score { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; line-height: 1; }
.matchup-proj { grid-column: 1 / -1; color: var(--text-muted); font-size: 0.72rem; font-family: var(--font-mono); }
.matchup-share { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bg); }
.matchup-share span { height: 100%; }
.matchup-share-label { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: -4px; }
.matchup-line { display: flex; gap: 6px; flex-wrap: wrap; }
.matchup-line .hx-pill b { color: var(--text); font-weight: 600; }
.division-title { color: var(--text-muted); font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; margin: 20px 0 8px; }
.division-title:first-child { margin-top: 0; }
.division-badge {
  display: inline-block; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600;
  letter-spacing: 0.03em; padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
}
.division-Gold { color: #D9B23C; background: rgba(217, 178, 60, 0.12); }
.division-Silver { color: #9A9A9A; background: rgba(154, 154, 154, 0.14); }
.division-Bronze { color: #A9784F; background: rgba(169, 120, 79, 0.14); }
/* Standings: one card per division */
.stand-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; }
.stand-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px 10px; }
.stand-card h3 { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; letter-spacing: 0.08em; margin: 10px 0 4px; }
.stand-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.stand-row:last-child { border-bottom: 0; }
.stand-row .pos { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); }
.stand-row .rec { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; text-align: right; }
.stand-row .meta { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); }
.stand-row .meta .hx-bar-track { flex: 1; }
.stand-row .meta .hx-pill { font-size: 0.66rem; }
/* Power rankings */
.rank-card { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 18px; margin-bottom: 10px; overflow: hidden; }
.rank-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--mc, var(--line-strong)); }
.rank-card.top3 { border-color: rgba(242, 183, 5, 0.35); background: linear-gradient(90deg, rgba(242, 183, 5, 0.07), rgba(242, 183, 5, 0) 40%), var(--surface); }
.rank-num-big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; line-height: 1; color: var(--live-bright); text-align: center; }
.rank-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rank-name .manager-tag { font-size: 1.2rem; font-weight: 600; }
.rank-name .manager-dot { width: 11px; height: 11px; }
.rank-trend { font-size: 0.72rem; font-family: var(--font-mono); font-weight: 600; white-space: nowrap; padding: 2px 8px; border-radius: 999px; background: var(--surface-raised); }
.rank-trend.up { color: #4FA876; background: rgba(79, 168, 118, 0.15); }
.rank-trend.down { color: #E0524A; background: rgba(224, 82, 74, 0.15); }
.rank-trend.same { color: var(--text-muted); }
.rank-body { min-width: 0; }
.rank-stats { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.rank-stats li { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); display: flex; flex-direction: column; gap: 1px; }
.rank-stats li b { color: var(--text); font-family: var(--font-mono); font-weight: 600; font-size: 0.92rem; letter-spacing: 0; text-transform: none; }
.rank-stats li small { font-size: 0.66rem; text-transform: none; letter-spacing: 0; }
@media (max-width: 560px) { .rank-card { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; } .rank-num-big { font-size: 1.9rem; } .rank-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.commentary-body { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; line-height: 1.75; font-size: 1rem; }
.commentary-body > * { max-width: 74ch; }
.commentary-body .cv { max-width: none; }
.commentary-body p { margin: 0 0 1em; white-space: pre-wrap; }
.commentary-body p:last-child { margin-bottom: 0; }
/* Inline commentary visuals (an entry's optional `visuals` array, placed via {{visual:id}} in body) */
.cv { margin: 6px 0 24px; padding: 16px 18px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
.cv-title { font-family: var(--font-display); font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 10px; color: var(--text); }
.cv-note { font-size: 0.76rem; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
.cv-table-wrap { overflow-x: auto; }
.cv table { width: 100%; border-collapse: collapse; font-size: 0.84rem; line-height: 1.4; }
.cv th { text-align: left; font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cv td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cv tr:last-child td { border-bottom: none; }
.cv .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cv td.em { color: var(--live-bright); font-weight: 600; }
.cv tr.hl td { background: rgba(61, 95, 224, 0.08); }
.cv-bars { display: flex; flex-direction: column; gap: 6px; }
.cv-bar-row { display: grid; grid-template-columns: minmax(90px, 30%) 1fr auto; gap: 10px; align-items: center; font-size: 0.82rem; }
.cv-bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cv-bar-track { height: 14px; }
.cv-bar-fill { height: 100%; border-radius: 0 3px 3px 0; background: var(--blue); min-width: 2px; }
.cv-bar-fill.tone-hot { background: var(--live-bright); }
.cv-bar-fill.tone-muted { background: var(--line-strong, #33405c); }
.cv-bar-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.8rem; min-width: 52px; text-align: right; }
.cv-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.74rem; color: var(--text-muted); margin-bottom: 10px; }
@media (max-width: 640px) { .commentary-body { padding: 16px; } .cv { padding: 12px 10px; } .cv th, .cv td { padding: 6px 5px; } .cv-bar-row { grid-template-columns: 96px 1fr auto; gap: 6px; } }
.cv-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.commentary-title { margin: 0 0 16px; font-size: clamp(1.4rem, 3.5vw, 1.9rem); line-height: 1.1; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.commentary-eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--live-bright); margin-bottom: 6px; }
.fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .fact-grid { grid-template-columns: 1fr; } }
.fact-card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 16px 20px; }
.fact-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line-strong); }
.fact-card.hot::before { background: var(--live-bright); } .fact-card.cold::before { background: var(--blue-bright); }
.fact-card.green::before { background: #4FA876; } .fact-card.red::before { background: #E0524A; }
.fact-card.hot { background: linear-gradient(135deg, rgba(242, 183, 5, 0.08), rgba(242, 183, 5, 0) 50%), var(--surface); }
.fact-card.wide { grid-column: 1 / -1; }
.fact-label {
  font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em;
  font-size: 0.68rem; color: var(--text-muted); margin: 0 0 8px;
}
.fact-headline { font-size: 1.1rem; font-weight: 600; margin: 0 0 6px; line-height: 1.35; }
.fact-headline .num { font-family: var(--font-display); font-size: 1.55em; font-weight: 600; letter-spacing: 0.01em; vertical-align: -0.06em; }
.fact-card.hot .fact-headline .num { color: var(--live-bright); }
.fact-card.cold .fact-headline .num { color: var(--blue-bright); }
.fact-card.green .fact-headline .num { color: #4FA876; }
.fact-card.red .fact-headline .num { color: var(--red); }
.fact-sub { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
.updated-note { color: var(--text-muted); font-size: 0.78rem; margin-bottom: 16px; }
.comments-section { margin-top: 28px; }
.comments-title {
  font-family: var(--font-display); font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 12px; border-left: 3px solid var(--live); padding-left: 10px;
}
</style>
</head>
<body>

<div class="container" style="padding-top: 24px;">
  <header class="hx-hero live compact">
    <div class="hx-eyebrow"><span class="nav-live-dot"></span> 2026 Hub</div>
    <h1>Weekly Hub</h1>
    <p>This week's matchups, standings, power rankings, recap and Brian's Fun Facts. Updated throughout the season.</p>
  </header>

  <div class="tab-row live">
    <button class="tab-btn active" data-tab="matchups">Matchups</button>
    <button class="tab-btn" data-tab="standings">Standings</button>
    <button class="tab-btn" data-tab="power">Power Rankings</button>
    <button class="tab-btn" data-tab="commentary">Commentary</button>
    <button class="tab-btn" data-tab="funfacts">Brian's Fun Facts</button>
  </div>

  <div class="panel active" id="panel-matchups">
    <div class="controls-row">
      <select id="matchupsWeek"></select>
    </div>
    <div id="matchupsContent">
      <div class="matchup-grid">
        <div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-standings">
    <div id="standingsContent">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>
    </div>
  </div>

  <div class="panel" id="panel-power">
    <div class="controls-row">
      <select id="powerWeek"></select>
    </div>
    <div id="powerContent">
      <div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div>
    </div>
  </div>

  <div class="panel" id="panel-commentary">
    <div class="controls-row">
      <select id="commentaryWeek"></select>
    </div>
    <div id="commentaryContent">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line"></div><div class="skeleton-line"></div>
    </div>
  </div>

  <div class="panel" id="panel-funfacts">
    <div class="controls-row">
      <select id="funFactsWeek"></select>
    </div>
    <div id="funFactsContent">
      <div class="fact-grid">
        <div class="skeleton-block"></div><div class="skeleton-block"></div>
        <div class="skeleton-block"></div><div class="skeleton-block"></div>
      </div>
    </div>
  </div>

</div>

<footer>National Wayzata League &middot; est. 2013</footer>

<script src="../assets/js/shared.js?v=22"></script>
<script>
let managers = [];
let matchups = [], standings = null, powerRankings = [], commentary = [], funFacts = [];
let managerDivision = {};
const DIVISION_ORDER = ['Gold', 'Silver', 'Bronze'];

function emptyState(headline, sub) {
  return `<div class="empty-state"><div class="headline">${headline}</div><p style="margin:0;">${sub}</p></div>`;
}

function divisionBadge(manager) {
  const div = managerDivision[manager];
  if (!div) return '';
  return `<span class="division-badge division-${div}">${div}</span>`;
}

function managerTagWithDivision(mgrList, name) {
  return managerTag(mgrList, name) + divisionBadge(name);
}

function populateWeekSelect(selectId, weeks, onChange) {
  const sel = document.getElementById(selectId);
  if (weeks.length === 0) {
    sel.innerHTML = '<option value="">No weeks yet</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = weeks.map(w => `<option value="${w}">Week ${w}</option>`).join('');
  sel.value = weeks[weeks.length - 1];
  sel.onchange = onChange;
}

function renderMatchups() {
  const week = document.getElementById('matchupsWeek').value;
  const entry = matchups.find(m => String(m.week) === String(week));
  if (!entry || !entry.games.length) {
    document.getElementById('matchupsContent').innerHTML = emptyState(
      'No matchups yet', 'Check back once the 2026 season kicks off in September.');
    return;
  }
  document.getElementById('matchupsContent').innerHTML = `
    <p class="updated-note">Last updated ${new Date(entry.updated_at).toLocaleString()}</p>
    <div class="matchup-grid">
      ${entry.games.map(g => {
        const done = g.winner === 'HOME' || g.winner === 'AWAY' || g.winner === 'TIE';
        const started = (g.home_score || 0) + (g.away_score || 0) > 0;
        const homeWin = g.winner === 'HOME', awayWin = g.winner === 'AWAY';
        const cls = (win, lose) => win ? 'winner' : lose ? 'loser' : '';
        // Share bar: actual points once scoring has started, projections before kickoff
        const useProj = !started && g.home_projected != null && g.away_projected != null;
        const hv = useProj ? g.home_projected : g.home_score, av = useProj ? g.away_projected : (g.away_score || 0);
        const tot = hv + av, hp = tot ? hv / tot * 100 : 50;
        const side = (mgr, score, proj, c) => `
          <div class="matchup-side ${c}" style="--mc:${mgr ? managerColor(managers, mgr) : 'var(--line-strong)'}">
            ${mgr ? managerTagWithDivision(managers, mgr) : '<span style="color:var(--text-muted)">BYE</span>'}
            <span class="matchup-score">${score != null ? score.toFixed(1) : ''}</span>
            ${proj != null ? `<div class="matchup-proj">proj ${proj.toFixed(1)}</div>` : ''}
          </div>`;
        return `
        <div class="matchup-card hover-lift">
          ${side(g.home_manager, g.home_score, g.home_projected, cls(homeWin, awayWin))}
          ${side(g.away_manager, g.away_score, g.away_projected, cls(awayWin, homeWin))}
          ${g.away_manager && tot ? `<div class="matchup-share" role="img" aria-label="${useProj ? 'Projected' : 'Points'} share"><span style="width:${hp.toFixed(1)}%;background:${managerColor(managers, g.home_manager)}"></span><span style="width:${(100 - hp).toFixed(1)}%;background:${managerColor(managers, g.away_manager)}"></span></div>
            <div class="matchup-share-label"><span>${useProj ? 'Projected' : done ? 'Final' : 'Live'}</span><span>${hp.toFixed(0)}% – ${(100 - hp).toFixed(0)}%</span></div>` : ''}
          ${g.line ? `
            <div class="matchup-line">
              <span class="hx-pill">Line <b>${g.line.favorite}${g.line.spread > 0 ? ' −' + g.line.spread.toFixed(1) : ' PK'}</b></span>
              <span class="hx-pill">O/U <b>${g.line.over_under.toFixed(1)}</b></span>
            </div>
          ` : ''}
        </div>
      `;
      }).join('')}
    </div>
  `;
}

function renderStandings() {
  if (!standings || !standings.standings || !standings.standings.length) {
    document.getElementById('standingsContent').innerHTML = emptyState(
      'No standings yet', 'Standings will appear here once the 2026 season is underway.');
    return;
  }
  const divisions = [...new Set(standings.standings.map(s => s.division))]
    .sort((a, b) => DIVISION_ORDER.indexOf(a) - DIVISION_ORDER.indexOf(b));
  const byDivision = {};
  divisions.forEach(div => {
    byDivision[div] = standings.standings
      .filter(s => s.division === div)
      .sort((a, b) => b.wins - a.wins || b.points_for - a.points_for);
  });

  const maxPF = Math.max(...standings.standings.map(s => s.points_for));
  const streak = s => !s.streak_length ? '' : `<span class="hx-pill ${s.streak_type === 'WIN' ? 'up' : s.streak_type === 'LOSS' ? 'down' : ''}">${s.streak_type.charAt(0)}${s.streak_length}</span>`;
  document.getElementById('standingsContent').innerHTML = `
    <p class="updated-note">As of week ${standings.week} &middot; updated ${new Date(standings.updated_at).toLocaleString()}</p>
    <div class="stand-grid">
    ${divisions.map(div => `
      <section class="stand-card">
        <h3><span class="division-badge division-${div}" style="margin:0">${div}</span><span class="hx-muted" style="font-size:.7rem;letter-spacing:.06em">W–L</span></h3>
        ${byDivision[div].map((s, i) => `
          <div class="stand-row">
            <span class="pos">${i + 1}</span>
            <span>${managerTag(managers, s.manager)}</span>
            <span class="rec">${s.wins}–${s.losses}${s.ties ? '–' + s.ties : ''}</span>
            <div class="meta"><span>${s.points_for.toFixed(1)} PF</span><div class="hx-bar-track"><div class="hx-bar-fill" style="width:${(s.points_for / maxPF * 100).toFixed(1)}%;--accent:${managerColor(managers, s.manager)}"></div></div><span>${s.points_against.toFixed(1)} PA</span>${streak(s)}</div>
          </div>
        `).join('')}
      </section>
    `).join('')}
    </div>
    <p class="hx-muted" style="font-size:.74rem;margin-top:10px">Bars show points for, relative to the league's top scorer.</p>
  `;
}

function renderPower() {
  const week = document.getElementById('powerWeek').value;
  const entry = powerRankings.find(p => String(p.week) === String(week) && p.published);
  if (!entry) {
    document.getElementById('powerContent').innerHTML = emptyState(
      'No power rankings published yet', 'Hunter reviews and publishes these weekly once the season is live.');
    return;
  }
  document.getElementById('powerContent').innerHTML = entry.rankings.map(r => `
    <div class="rank-card hover-lift${r.rank <= 3 ? ' top3' : ''}" style="--mc:${managerColor(managers, r.manager)}">
      <div class="rank-num-big">${r.rank}</div>
      <div class="rank-body">
        <div class="rank-name-row">
          <span class="rank-name">${managerTagWithDivision(managers, r.manager)}</span>
          <span class="rank-trend ${r.trend}">${trendLabel(r)}</span>
        </div>
        ${r.record_actual ? `
          <ul class="rank-stats">
            <li>Record<b>${r.record_actual}</b></li>
            <li>Expected wins<b>${r.expected_wins}</b></li>
            <li>PPG<b>${r.ppg}</b></li>
            <li>Last ${r.recent_games}<b>${r.recent_record}</b><small>${r.recent_ppg} PPG</small></li>
            <li>Strength of schedule<b>${sosLabel(r.sos_rank, r.sos_total)}</b></li>
            ${r.remaining_sos_rank ? `<li>Remaining SoS<b>${sosLabel(r.remaining_sos_rank, r.sos_total)}</b><small>next ${r.remaining_games} games</small></li>` : ''}
          </ul>
        ` : ''}
      </div>
    </div>
  `).join('');
}

// Spots moved since the prior published week, with a fire/snowflake for a big swing (more than
// 2 spots either way). delta is 0 (not null) for a manager's first-ever ranked week, which
// renders the same as "no movement" - there's nothing to compare against yet either way.
function trendLabel(r) {
  const delta = r.delta || 0;
  if (delta === 0) {
    const weeks = r.rank_streak || 1;
    return `&#8212; ${weeks} wk${weeks === 1 ? '' : 's'}`;
  }
  const arrow = delta > 0 ? '&#9650;' : '&#9660;';
  const emoji = delta > 2 ? ' \u{1F525}' : delta < -2 ? ' ❄️' : '';
  return `${arrow}${Math.abs(delta)}${emoji}`;
}

// "1st (hardest)" / "12th (easiest)" only at the two extremes, plain ordinal otherwise.
function sosLabel(rank, total) {
  if (rank === 1) return `${ordinal(rank)} (hardest)`;
  if (rank === total) return `${ordinal(rank)} (easiest)`;
  return ordinal(rank);
}

function ordinal(n) {
  const rem100 = n % 100;
  if (rem100 >= 11 && rem100 <= 13) return `${n}th`;
  switch (n % 10) {
    case 1: return `${n}st`;
    case 2: return `${n}nd`;
    case 3: return `${n}rd`;
    default: return `${n}th`;
  }
}

          <p class="fact-sub">${f.sub}</p>

      `).join('')}
    </div>
  `;
}

const GISCUS_REPO = 'hunterzogg/nwl_site';

const GISCUS_CATEGORY = 'Announcements';
const GISCUS_CATEGORY_ID = 'DIC_kwDOTSHvaM4DAyKl';

// Commentary body: paragraphs split on blank lines. A paragraph that is exactly {{visual:<id>}}
// is replaced by the matching entry in the entry's optional `visuals` array, so a week's recap can
// carry tables/bar charts inline. Visual shapes (hand-authored in commentary.json):
//   {id, type: 'table', title, note?, columns: [{key, label, num?, manager?}], rows: [{...cells, _hl?, _em?: [keys]}]}
//   {id, type: 'bar', title, note?, unit?, legend?: [{label, tone}], bars: [{label, manager?, value, tone?: 'hot'|'muted'}]}
function commentaryBodyHTML(entry) {
  const visuals = {};
  (entry.visuals || []).forEach(v => { visuals[v.id] = v; });
  return entry.body.split(/\n\s*\n/).map(par => {
    const m = par.trim().match(/^\{\{visual:([\w-]+)\}\}$/);
    if (m) return visuals[m[1]] ? commentaryVisualHTML(visuals[m[1]]) : '';
    return `<p>${par}</p>`;
  }).join('');
}

function commentaryVisualHTML(v) {
  const title = v.title ? `<div class="cv-title">${v.title}</div>` : '';
  const note = v.note ? `<div class="cv-note">${v.note}</div>` : '';
  if (v.type === 'table') {
    const head = v.columns.map(c => `<th class="${c.num ? 'num' : ''}">${c.label}</th>`).join('');
    const body = v.rows.map(r => `<tr class="${r._hl ? 'hl' : ''}">${v.columns.map(c => {
      const val = r[c.key] === undefined || r[c.key] === null ? '' : r[c.key];
      const cls = [c.num ? 'num' : '', (r._em || []).includes(c.key) ? 'em' : ''].join(' ').trim();
      return `<td class="${cls}">${c.manager && val ? managerTag(managers, val) : val}</td>`;
    }).join('')}</tr>`).join('');
    return `<div class="cv">${title}<div class="cv-table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${note}</div>`;
  }
  if (v.type === 'bar') {
    const max = Math.max(...v.bars.map(b => b.value), 0) || 1;
    const legend = v.legend ? `<div class="cv-legend">${v.legend.map(l =>
      `<span><i class="cv-bar-fill${l.tone ? ' tone-' + l.tone : ''}"></i>${l.label}</span>`).join('')}</div>` : '';
    const bars = v.bars.map(b => `
      <div class="cv-bar-row">
        <span class="cv-bar-label">${b.manager ? managerTag(managers, b.manager) + (b.label ? ' ' + b.label : '') : b.label}</span>
        <div class="cv-bar-track"><div class="cv-bar-fill${b.tone ? ' tone-' + b.tone : ''}" style="width:${(b.value / max * 100).toFixed(1)}%"></div></div>
        <span class="cv-bar-value">${b.display || b.value}${v.unit ? ' ' + v.unit : ''}</span>
      </div>`).join('');
    return `<div class="cv">${title}${legend}<div class="cv-bars">${bars}</div>${note}</div>`;
  }
  return '';
}

function renderCommentary() {
  const week = document.getElementById('commentaryWeek').value;
  const entry = commentary.find(c => String(c.week) === String(week) && c.published);
  if (!entry) {
    document.getElementById('commentaryContent').innerHTML = emptyState(
      'No recap published yet', 'Weekly commentary shows up here once Hunter publishes it.');
    return;
  }
  document.getElementById('commentaryContent').innerHTML = `
    <div class="commentary-body">
      <div class="commentary-eyebrow">Week ${entry.week} recap</div>
      ${entry.title ? `<h2 class="commentary-title">${entry.title}</h2>` : ''}
      ${commentaryBodyHTML(entry)}
    </div>
    <div class="comments-section">
      <div class="comments-title">Discussion</div>
      <div id="giscus-container"></div>

  const script = document.createElement('script');

  script.setAttribute('data-repo-id', GISCUS_REPO_ID);
  script.setAttribute('data-category', GISCUS_CATEGORY);
  script.setAttribute('data-category-id', GISCUS_CATEGORY_ID);
  script.setAttribute('data-mapping', 'specific');
  script.setAttribute('data-term', `season-2026-week-${entry.week}`);
  script.setAttribute('data-strict', '0');
  script.setAttribute('data-reactions-enabled', '1');
  script.setAttribute('data-emit-metadata', '0');
  script.setAttribute('data-input-position', 'top');
  script.setAttribute('data-theme', 'noborder_dark');
  script.setAttribute('data-lang', 'en');
  script.setAttribute('crossorigin', 'anonymous');
  script.async = true;
  document.getElementById('giscus-container').appendChild(script);
}

async function init() {
  managers = await getManagers();
  [matchups, standings, powerRankings, commentary, funFacts] = await Promise.all([
    loadDataSafe('season_2026/matchups', []),
    loadDataSafe('season_2026/standings', null),
    loadDataSafe('season_2026/power_rankings', []),
    loadDataSafe('season_2026/commentary', []),
    loadDataSafe('season_2026/fun_facts', []),
  ]);

  managerDivision = {};
  if (standings && standings.standings) {
    standings.standings.forEach(s => { managerDivision[s.manager] = s.division; });
  }

  const matchupWeeks = matchups.map(m => m.week);
  populateWeekSelect('matchupsWeek', matchupWeeks, renderMatchups);

  const powerWeeks = powerRankings.filter(p => p.published).map(p => p.week);
  populateWeekSelect('powerWeek', powerWeeks, renderPower);

  const commentaryWeeks = commentary.filter(c => c.published).map(c => c.week);
  populateWeekSelect('commentaryWeek', commentaryWeeks, renderCommentary);

  const funFactsWeeks = funFacts.filter(f => f.published).map(f => f.week);
  populateWeekSelect('funFactsWeek', funFactsWeeks, renderFunFacts);

  renderMatchups();
  renderStandings();
  renderPower();
  renderCommentary();
  renderFunFacts();

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });
}

renderNav('2026 hub');
init();
